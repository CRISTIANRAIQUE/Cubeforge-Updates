name: Compilar ModCentral Forge 1.20.1
on:
  push:
    branches: [modcentral-aetheric-forge-1.20.1-build]
    paths-ignore: ['dist/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Preparar texturas
        run: python3 generate_assets.py
      - name: Compilar com ForgeGradle e remapear
        run: gradle --no-daemon clean build --stacktrace
      - name: Conferir JAR
        run: |
          ls -lh build/libs/
          test -f build/libs/modcentral-1.1.3.jar
          unzip -t build/libs/modcentral-1.1.3.jar
          unzip -p build/libs/modcentral-1.1.3.jar META-INF/mods.toml | grep -q '47.4.28'
          unzip -l build/libs/modcentral-1.1.3.jar | grep -q 'br/minecraft/modcentral/ModCentral.class'
      - name: Publicar arquivo .jar na branch isolada
        run: |
          mkdir -p dist
          cp build/libs/modcentral-1.1.3.jar dist/ModCentral-Aetheric-Arms-Forge-1.20.1-47.4.28.jar
          git config user.name 'modcentral-build[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/ModCentral-Aetheric-Arms-Forge-1.20.1-47.4.28.jar
          git commit -m 'Build ModCentral 1.1.3 [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ModCentral-Aetheric-Arms-Forge-1.20.1
          path: build/libs/modcentral-1.1.3.jar
          if-no-files-found: error
