name: Compilar ModCentral Fabric 26.3 Java 25
on:
  push:
    branches: [modcentral-fabric-26.3-minerios-espada]
    paths-ignore:
      - 'dist/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Gerar texturas e recursos
        run: python3 generate_assets.py
      - name: Compilar com Fabric Loom oficial
        run: gradle --no-daemon clean build --stacktrace
      - name: Validar mod JAR e conteudo
        run: |
          ls -lh build/libs
          test -f build/libs/ModCentral-Fabric-26.3-1.0.0.jar
          unzip -t build/libs/ModCentral-Fabric-26.3-1.0.0.jar
          unzip -l build/libs/ModCentral-Fabric-26.3-1.0.0.jar | grep -q "br/cubeforge/modcentral/ModCentral.class"
          unzip -l build/libs/ModCentral-Fabric-26.3-1.0.0.jar | grep -q "assets/modcentral/textures/item/espada_cristal_azul.png"
          unzip -l build/libs/ModCentral-Fabric-26.3-1.0.0.jar | grep -q "assets/modcentral/textures/block/minerio_cristal_azul.png"
          unzip -p build/libs/ModCentral-Fabric-26.3-1.0.0.jar fabric.mod.json | grep -q '"minecraft": "26.3"'
      - name: Publicar somente o JAR na branch isolada
        run: |
          mkdir -p dist
          cp build/libs/ModCentral-Fabric-26.3-1.0.0.jar dist/ModCentral-Fabric-26.3.jar
          git config user.name 'modcentral-build[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/ModCentral-Fabric-26.3.jar
          git commit -m 'Publicar .jar Fabric 26.3 compilado [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ModCentral-Fabric-26.3-JAR
          path: build/libs/ModCentral-Fabric-26.3-1.0.0.jar
          if-no-files-found: error
