name: Build ModCentral Fabric 26.3 - Gelo Azul 3D v1.2.0
on:
  push:
    branches: [modcentral-fabric-263-3d-gelo-v1-2-0]
    paths-ignore: ['dist/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Gerar recursos e texturas originais
        run: python3 generate_assets.py && python3 generate_assets_3d.py
      - name: Compilar e remapear JAR usando Fabric Loom
        run: gradle --no-daemon clean build --stacktrace
      - name: Validar integridade do JAR, texturas e geometria dos itens
        run: |
          test -f build/libs/ModCentral-Fabric-26.3-1.2.0.jar
          unzip -t build/libs/ModCentral-Fabric-26.3-1.2.0.jar
          python3 - <<'PY'
          import zipfile, json, struct, sys
          path='build/libs/ModCentral-Fabric-26.3-1.2.0.jar'
          names=['espada_cristal_azul','machado_cristal_azul','picareta_cristal_azul','pa_cristal_azul','enxada_cristal_azul','cristal_azul']
          with zipfile.ZipFile(path) as z:
              meta=json.loads(z.read('fabric.mod.json'))
              assert meta['version']=='1.2.0' and meta['depends']['minecraft']=='26.3'
              assert meta['depends']['java']=='>=25'
              assert 'br/cubeforge/modcentral/ModCentral.class' in z.namelist()
              for name in names:
                  p=f'assets/modcentral/models/item/{name}.json'
                  m=json.loads(z.read(p))
                  assert len(m['elements'])>=40,(p,len(m.get('elements',[])))
                  assert all('from' in e and 'to' in e and e['from'][2]!=e['to'][2] for e in m['elements'])
                  assert 'firstperson_righthand' in m['display']
                  texture=z.read(f'assets/modcentral/textures/item/{name}.png')
                  assert texture[:8]==b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II',texture[16:24])==(16,16)
              for ore in ('minerio_cristal_azul','minerio_cristal_profundo'):
                  assert f'assets/modcentral/textures/block/{ore}.png' in z.namelist()
              print('VALIDADO: 6 modelos realmente tridimensionais, 8 PNG, Fabric 26.3, Java 25.')
          PY
      - name: Publicar somente o JAR final
        run: |
          mkdir -p dist
          cp build/libs/ModCentral-Fabric-26.3-1.2.0.jar dist/ModCentral-Fabric-26.3-Gelo-3D-v1.2.0.jar
          git config user.name 'modcentral-build[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/ModCentral-Fabric-26.3-Gelo-3D-v1.2.0.jar
          git commit -m 'Publicar ModCentral gelo 3D v1.2.0 [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ModCentral-Fabric-26.3-Gelo-3D-v1.2.0
          path: build/libs/ModCentral-Fabric-26.3-1.2.0.jar
          if-no-files-found: error
